<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Console — Euisuh Jeong</title>
<meta name="robots" content="noindex, nofollow" />
<script>
  (function () {
    try {
      var th = localStorage.getItem('ej_theme');
      if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #7dd3fc;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --gap: 20px;
  }
  html[data-theme="dark"] {
    --bg: #08090d;
    --bg-2: #0c0e14;
    --line: rgba(125, 211, 252, 0.10);
    --line-strong: rgba(125, 211, 252, 0.22);
    --text: #d4dde9;
    --text-dim: #6b7685;
    --text-mute: #475060;
  }
  html[data-theme="light"] {
    --bg: #f3f6f9;
    --bg-2: #e7ecf2;
    --line: rgba(14, 60, 100, 0.09);
    --line-strong: rgba(14, 60, 100, 0.20);
    --text: #111b24;
    --text-dim: #596977;
    --text-mute: #8896a5;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: clip; }
  *::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 20%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
  }
  .scan {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: overlay; opacity: 0.16;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }
  html[data-theme="light"] .scan { display: none; }

  .wrap { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto; padding: 0 32px 60px; }

  /* ── topbar ── */
  .topbar { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px) saturate(140%); background: color-mix(in oklab, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  .topbar-inner { display: flex; align-items: center; gap: 16px; padding: 10px 32px; max-width: 1180px; margin: 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 2.4s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .topbar .brand { color: var(--text); letter-spacing: 0.02em; white-space: nowrap; }
  .topbar .nav { display: flex; gap: 14px; margin-left: auto; }
  .topbar .nav a { color: var(--text-dim); transition: color .2s; }
  .topbar .nav a:hover { color: var(--accent); }
  .topbar .clock { color: var(--text-dim); min-width: 164px; white-space: nowrap; }
  .theme-toggle {
    appearance: none; background: transparent;
    border: 1px solid var(--line-strong); color: var(--text-dim);
    width: 28px; height: 26px; border-radius: 7px;
    display: inline-grid; place-items: center; padding: 0;
    transition: color .2s, border-color .2s, background .2s; flex: 0 0 auto;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }

  /* ── hero ── */
  .hero { padding: 72px 0 24px; }
  .hero .kicker { font-family: var(--mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.2em; text-transform: uppercase; }
  .hero h1 { font-family: var(--sans); font-weight: 700; font-size: clamp(40px, 6.4vw, 76px); line-height: 0.98; letter-spacing: -0.03em; margin: 16px 0 0; }
  .hero h1 .accent { color: var(--accent); }
  .hero h1 .ser { font-family: var(--serif); font-style: italic; font-weight: 400; }
  .hero .lede { color: var(--text-dim); font-size: clamp(15px, 1.8vw, 18px); line-height: 1.6; margin: 20px 0 0; max-width: 60ch; }

  /* ── section header ── */
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 36px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--text-mute); }
  kbd { font-family: var(--mono); background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; font-size: 11px; color: var(--text-dim); }

  /* ── shared tile ── */
  .tile {
    width: 48px; height: 48px; border-radius: 10px;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    background: color-mix(in oklab, var(--tone) 18%, transparent);
    color: var(--tone);
    border: 1px solid color-mix(in oklab, var(--tone) 30%, transparent);
    flex: 0 0 auto;
  }

  /* ── pills ── */
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 20px; padding: 2px 8px; }
  .pill.live { background: color-mix(in oklab, #4ade80 12%, transparent); color: #4ade80; border: 1px solid color-mix(in oklab, #4ade80 25%, transparent); }
  .pill.soon { background: color-mix(in oklab, var(--text-mute) 8%, transparent); color: var(--text-mute); border: 1px solid color-mix(in oklab, var(--text-mute) 18%, transparent); }

  /* ── access badge ── */
  .access-badge { font-family: var(--mono); font-size: 10px; color: var(--text-mute); display: flex; align-items: center; gap: 4px; }

  /* ── A. GRID ── */
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--gap); margin-top: 20px; }
  .tool-card {
    border: 1px solid var(--line);
    background: color-mix(in oklab, var(--bg) 84%, transparent);
    border-radius: 12px; padding: 24px; cursor: pointer;
    transition: border-color .18s, background .18s, transform .18s;
    display: flex; flex-direction: column; gap: 14px;
    text-align: left;
  }
  .tool-card:hover { border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--bg-2); transform: translateY(-2px); }
  .tool-card.soon { opacity: 0.5; cursor: default; }
  .tool-card.soon:hover { transform: none; border-color: var(--line); background: color-mix(in oklab, var(--bg) 84%, transparent); }
  .c-top { display: flex; align-items: center; justify-content: space-between; }
  .c-name { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; margin: 0; }
  .c-kind { font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 3px; }
  .c-desc { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; flex: 1; margin: 0; }
  .c-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .c-action { font-family: var(--mono); font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }

  /* ── B. ROSTER ── */
  .tool-roster { display: flex; flex-direction: column; margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .roster-row {
    display: grid; grid-template-columns: 40px 52px 180px 1fr auto auto;
    align-items: center; gap: 18px; padding: 16px 20px;
    background: transparent; border: 0; border-top: 1px solid var(--line);
    cursor: pointer; color: var(--text); width: 100%;
    transition: background .15s;
    text-align: left;
  }
  .roster-row:first-of-type { border-top: none; }
  .roster-row:hover { background: var(--bg-2); }
  .roster-row.soon { opacity: 0.5; cursor: default; }
  .r-idx { font-family: var(--mono); font-size: 13px; color: var(--text-mute); }
  .r-name { font-weight: 700; font-size: 15px; }
  .r-kind { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .r-desc { font-size: 13px; color: var(--text-dim); }
  .r-action { font-family: var(--mono); font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 5px; white-space: nowrap; }

  /* ── C. DOCK ── */
  .tool-dock { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 20px; }
  .dock-head { display: flex; justify-content: space-between; padding: 10px 18px; background: var(--bg-2); font-family: var(--mono); font-size: 10px; color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  .dock-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    cursor: pointer; border-top: 1px solid var(--line);
    transition: background .15s; background: transparent;
    border-left: 0; border-right: 0; border-bottom: 0; width: 100%;
    color: var(--text); text-align: left;
  }
  .dock-row:hover { background: var(--bg-2); }
  .dock-row.soon { opacity: 0.5; cursor: default; }
  .d-key { font-family: var(--mono); font-size: 13px; color: var(--text-mute); min-width: 30px; flex: 0 0 auto; }
  .d-name { font-weight: 700; font-size: 15px; }
  .d-kind { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .d-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .d-arrow { color: var(--accent); }

  /* ── toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 10px 18px; font-family: var(--mono); font-size: 13px; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
    opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── footer ── */
  footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--text-mute); }

  /* ── reveal ── */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  @media (max-width: 880px) {
    .topbar-inner { padding: 10px 18px; gap: 10px; }
    .topbar .nav, .topbar .clock { display: none; }
    .theme-toggle { margin-left: auto; }
    .wrap { padding: 0 18px 40px; }
    .hero { padding: 48px 0 20px; }
    .roster-row { grid-template-columns: 40px 44px 1fr auto auto; }
    .r-desc { display: none; }
  }
  @media (max-width: 520px) {
    .wrap { padding: 0 16px 32px; }
    .tool-grid { grid-template-columns: 1fr; }
    .roster-row { grid-template-columns: 36px 40px 1fr auto; }
    .r-kind { display: none; }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scan"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/console-app.jsx"></script>
</body>
</html>
