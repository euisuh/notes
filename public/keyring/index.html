<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Keyring — OTP Vault</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/keyring/manifest.json" />
<script>
  (function () {
    try {
      var th = localStorage.getItem('ej_theme');
      if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #7dd3fc;
    --warn: #ff6a6a;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --row-pad: 12px 10px;
  }
  html[data-theme="dark"] {
    --bg: #08090d;
    --bg-2: #0c0e14;
    --surface: #12151e;
    --line: rgba(125, 211, 252, 0.10);
    --border: rgba(125, 211, 252, 0.14);
    --line-strong: rgba(125, 211, 252, 0.22);
    --text: #d4dde9;
    --text-2: #6b7685;
    --text-dim: #6b7685;
    --text-mute: #475060;
    --accent-soft: color-mix(in oklab, #7dd3fc 15%, transparent);
    --code-bg: #0c0e14;
    --hover: color-mix(in oklab, #7dd3fc 8%, transparent);
    --press: color-mix(in oklab, #7dd3fc 14%, transparent);
    --shadow: 0 2px 12px rgba(0,0,0,0.5);
    --font-ui: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[data-theme="light"] {
    --bg: #f3f6f9;
    --bg-2: #e7ecf2;
    --surface: #fff;
    --line: rgba(14, 60, 100, 0.09);
    --border: rgba(14, 60, 100, 0.14);
    --line-strong: rgba(14, 60, 100, 0.20);
    --text: #111b24;
    --text-2: #596977;
    --text-dim: #596977;
    --text-mute: #8896a5;
    --accent-soft: color-mix(in oklab, #7dd3fc 15%, transparent);
    --code-bg: #e7ecf2;
    --hover: color-mix(in oklab, #7dd3fc 10%, transparent);
    --press: color-mix(in oklab, #7dd3fc 18%, transparent);
    --shadow: 0 2px 12px rgba(0,0,0,0.10);
    --font-ui: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: clip; }
  *::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 20%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
  }
  .scan {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: overlay; opacity: 0.16;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }
  html[data-theme="light"] .scan { display: none; }

  .mono { font-family: var(--font-mono); }
  .acc-row:hover { background: var(--hover) !important; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scan"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/keyring-lib.jsx"></script>
  <script type="text/babel" src="/keyring-screens.jsx"></script>
  <script type="text/babel" src="/keyring-app.jsx"></script>
</body>
</html>
