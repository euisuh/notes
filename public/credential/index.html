<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authenticate — Console</title>
<meta name="robots" content="noindex, nofollow" />
<script>
  (function () {
    try {
      var th = localStorage.getItem('ej_theme');
      if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #7dd3fc;
    --warn: #ff6a6a;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
  }
  html[data-theme="dark"] {
    --bg: #08090d;
    --bg-2: #0c0e14;
    --line: rgba(125, 211, 252, 0.10);
    --line-strong: rgba(125, 211, 252, 0.22);
    --text: #d4dde9;
    --text-dim: #6b7685;
    --text-mute: #475060;
  }
  html[data-theme="light"] {
    --bg: #f3f6f9;
    --bg-2: #e7ecf2;
    --line: rgba(14, 60, 100, 0.09);
    --line-strong: rgba(14, 60, 100, 0.20);
    --text: #111b24;
    --text-dim: #596977;
    --text-mute: #8896a5;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: clip; }
  *::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 20%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
  }
  .scan {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: overlay; opacity: 0.16;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }
  html[data-theme="light"] .scan { display: none; }

  /* ── topbar ── */
  .topbar { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px) saturate(140%); background: color-mix(in oklab, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  .topbar-inner { display: flex; align-items: center; gap: 16px; padding: 10px 32px; max-width: 1180px; margin: 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 2.4s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .topbar .brand { color: var(--text); letter-spacing: 0.02em; }
  .spacer { flex: 1; }
  .back-link { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); transition: color .2s; white-space: nowrap; }
  .back-link:hover { color: var(--accent); }
  .topbar .clock { color: var(--text-dim); min-width: 164px; white-space: nowrap; }
  .theme-toggle {
    appearance: none; background: transparent;
    border: 1px solid var(--line-strong); color: var(--text-dim);
    width: 28px; height: 26px; border-radius: 7px;
    display: inline-grid; place-items: center; padding: 0;
    transition: color .2s, border-color .2s, background .2s; flex: 0 0 auto;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }

  /* ── credential form ── */
  .cred-wrap {
    position: relative; z-index: 2;
    display: grid; place-items: center;
    min-height: calc(100vh - 50px);
    padding: 40px 24px;
  }
  .cred-inner { width: 100%; max-width: 420px; }
  .svc-badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 28px;
  }
  .svc-tile {
    width: 36px; height: 36px; border-radius: 8px;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  }
  .kicker { font-family: var(--mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .accent { color: var(--accent); }
  .ser { font-family: var(--serif); font-style: italic; font-weight: 400; }
  .cred-h1 { font-family: var(--sans); font-weight: 700; font-size: clamp(28px, 5vw, 46px); line-height: 1.0; letter-spacing: -0.03em; margin: 0 0 16px; }
  .cred-lede { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
  .cred-lede b { color: var(--text); font-weight: 600; }
  .cred-label { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 0.06em; }
  .cred-input {
    width: 100%; height: 46px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg-2); color: var(--text);
    font-family: var(--mono); font-size: 13px;
    padding: 0 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .cred-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
  .cred-err { color: var(--warn); font-family: var(--mono); font-size: 12.5px; }
  .cred-btn-primary {
    width: 100%; height: 48px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 10px;
    font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; transition: opacity .18s;
  }
  .cred-btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .cred-btn-primary:disabled { opacity: 0.5; cursor: default; }
  .cred-divider { position: relative; text-align: center; margin: 20px 0; }
  .cred-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid var(--line); }
  .cred-or { position: relative; background: var(--bg); padding: 0 10px; font-family: var(--mono); font-size: 11px; color: var(--text-mute); }
  html[data-theme="light"] .cred-or { background: var(--bg); }
  .cred-btn-ghost {
    width: 100%; height: 44px;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--text-dim); border-radius: 10px;
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    cursor: pointer; transition: color .2s, border-color .2s, background .2s;
  }
  .cred-btn-ghost:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .cred-hint { font-family: var(--mono); font-size: 11px; color: var(--text-mute); text-align: center; margin: 12px 0 0; line-height: 1.5; }

  @media (max-width: 880px) {
    .topbar-inner { padding: 10px 18px; gap: 10px; }
    .topbar .clock { display: none; }
    .theme-toggle { margin-left: auto; }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scan"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="/credential-app.jsx"></script>
</body>
</html>
