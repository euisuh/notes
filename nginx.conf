server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── console ──
    location = /console {
        try_files /console/index.html =404;
    }
    location = /console/ {
        return 301 /console;
    }

    # ── keyring frontend ──
    location = /keyring {
        return 301 /keyring/;
    }
    location = /keyring/ {
        try_files /keyring/index.html =404;
    }

    # ── keyring auth API (backend service) ──
    location ^~ /keyring/api/ {
        proxy_pass http://keyring-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── notes ──
    location = /notes {
        try_files /notes/index.html =404;
    }
    location = /notes/ {
        return 301 /notes;
    }

    # ── credential gate ──
    location = /credential {
        try_files /credential/index.html =404;
    }
    location = /credential/ {
        return 301 /credential;
    }

    # ── static assets ──
    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ~* \.(?:css|js|jsx|svg|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt { log_not_found off; access_log off; }
    location = /favicon.ico { log_not_found off; access_log off; }

    location / {
        try_files $uri $uri/ =404;
    }
}
